name: Android 12 Release APK

on:
  workflow_dispatch:
  push:
    branches: [ android-12 ]

jobs:
  build:
    name: Build arm64 Release APK (minSdk 31)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;30.0.16248370'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Cache Prebuilt Native Libraries (.so)
        id: cache-prebuilt
        uses: actions/cache@v4
        with:
          path: external/prebuilt/
          key: prebuilt-so-${{ runner.os }}-${{ hashFiles('scripts/versions.sh', 'gradle/config.versions.toml') }}

      - name: Install Host Build Tools
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gperf \
            yasm \
            nasm \
            python3-pip \
            python3-setuptools \
            python3-wheel
          pip3 install --upgrade --break-system-packages meson

      - name: Sync Native Sources & Build Native Libraries
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/*.sh scripts/components/*.sh
          ./scripts/sync-sources.sh --fast
          ./scripts/build-native.sh arm64 all

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsekaiPlayer-android12-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
